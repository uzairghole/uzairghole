  <circle cx="22" cy="95" r="6" fill="#6366f1"/><circle cx="151" cy="72" r="6" fill="#6366f1"/><circle cx="265" cy="8" r="6" fill="#6366f1"/>
</g>

<!-- database -->
<g transform="translate(1510 560)">
  <ellipse cx="75" cy="18" rx="65" ry="20" fill="#8ebcf0"/>
  <path d="M10 18 V100 C10 122 140 122 140 100 V18" fill="#cfe2fa"/>
  <ellipse cx="75" cy="100" rx="65" ry="20" fill="#9fc7f1"/>
  <ellipse cx="75" cy="18" rx="65" ry="20" fill="#65a5e8"/>
  <path d="M10 58 C10 80 140 80 140 58" fill="none" stroke="#8bb9eb" stroke-width="3"/>
</g>

<!-- pandas/data table -->
<g transform="translate(935 610)">
