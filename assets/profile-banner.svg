  <rect x="145" y="29" width="44" height="25" fill="#d8d9fb"/>
</g>

<!-- small Git-like mark -->
<g transform="translate(1510 700)">
  <path d="M55 0 L110 55 L55 110 L0 55 Z" fill="url(#purple)" opacity=".9"/>
  <path d="M34 57 L53 76 L79 47" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- title -->
<text x="130" y="405" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" fill="#071b49">Uzair Ghole</text>
<text x="132" y="477" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#334b70">Aspiring Data Science Professional | TY BSc IT Student</text>

