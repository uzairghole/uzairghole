<svg xmlns="http://www.w3.org/2000/svg" width="1727" height="864" viewBox="0 0 1727 864">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".58" stop-color="#f8fbff"/>
    <stop offset="1" stop-color="#edf4ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/>
    <stop offset="1" stop-color="#6366f1"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#818cf8"/>
    <stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="2" fill="#60a5fa" opacity=".16"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1727" height="864" fill="url(#bg)"/>
<rect width="1727" height="864" fill="url(#dots)"/>

<!-- soft background shapes -->
<circle cx="165" cy="-35" r="330" fill="#e8f1ff" opacity=".72"/>
<circle cx="1685" cy="40" r="285" fill="#dbeafe" opacity=".72"/>
<path d="M0 735 C250 650 360 800 610 720 S980 655 1220 730 S1510 760 1727 680 L1727 864 L0 864Z" fill="#eef5ff"/>
<path d="M0 760 C260 670 390 820 650 740 S1020 675 1260 745 S1530 775 1727 700" fill="none" stroke="#c7ddff" stroke-width="3" opacity=".7"/>

<!-- decorative network -->
<g opacity=".45" stroke="#b9d8ff" stroke-width="2">
  <path d="M1080 120 L1165 190 L1260 145 L1355 215 L1450 145"/>
  <path d="M1165 190 L1215 275 L1320 300 L1405 245"/>
</g>
<g fill="#60a5fa" opacity=".75">
  <circle cx="1080" cy="120" r="8"/><circle cx="1165" cy="190" r="9"/>
  <circle cx="1260" cy="145" r="8"/><circle cx="1355" cy="215" r="9"/>
</g>

<!-- top right code symbol -->
<text x="1360" y="145" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#7aa8e8">&lt;/&gt;</text>

<!-- Python-like mark -->
