  <circle cx="72" cy="72" r="72" fill="none" stroke="#8b82e8" stroke-width="2" opacity=".55"/>
  <text x="72" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#0b244f">17</text>
