  <path d="M70 0 L140 40 L70 80 L0 40 Z"/>
  <path d="M0 40 V120 L70 160 L140 120 V40"/>
  <path d="M70 80 V160"/>
  <path d="M35 60 L105 100"/>
</g>
<path d="M1208 375 L1242 395 L1242 435 L1208 415Z" fill="#bde6f6" opacity=".8"/>

<!-- bar chart -->
