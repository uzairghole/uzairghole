  <rect x="25" y="105" width="38" height="45" rx="4" fill="#d8e8fb"/>
  <rect x="82" y="78" width="38" height="72" rx="4" fill="#c9ddfa"/>
  <rect x="139" y="48" width="38" height="102" rx="4" fill="#9fc5f5"/>
